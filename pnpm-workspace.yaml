# pnpm 설정. pnpm 10 부터 overrides 등이 package.json 에서 여기로 옮겨왔다.
#
# tinyspy 고정: vitest 3 으로 올리면서 딸려온 4.0.6 이 갓 발행된 버전이라
# 배포 서버의 공급망 정책(최소 경과 시간)에 걸린다. 4.0.4 는 2025-09 발행이라
# 취지에 어긋나지 않으면서 통과한다. 최신 버전이 시간이 지나 통과하게 되면
# 이 줄은 지워도 된다.
overrides:
  tinyspy: 4.0.4

# esbuild 는 설치할 때 자기 바이너리를 내려받는 스크립트를 돌린다.
# pnpm 11 부터는 그런 스크립트를 조용히 건너뛰지 않고 에러로 멈추므로,
# 여기서 명시적으로 허용해야 배포가 진행된다(vite 와 vitest 가 각자 물고 있다).
onlyBuiltDependencies:
  - esbuild
