# pnpm 설정. pnpm 10 부터 overrides 등이 package.json 에서 여기로 옮겨왔다.
#
# tinyspy 고정: vitest 3 으로 올리면서 딸려온 4.0.6 이 갓 발행된 버전이라
# 배포 서버의 공급망 정책(최소 경과 시간)에 걸린다. 4.0.4 는 2025-09 발행이라
# 취지에 어긋나지 않으면서 통과한다. 최신 버전이 시간이 지나 통과하게 되면
# 이 줄은 지워도 된다.
overrides:
  tinyspy: 4.0.4

# esbuild 는 설치할 때 자기 바이너리를 내려받는 스크립트를 돌린다.
# 허용하지 않으면 pnpm 11 이 ERR_PNPM_IGNORED_BUILDS 로 멈춰 배포가 안 된다.
#
# 두 이름을 다 적는다 — 로컬(pnpm 10)은 onlyBuiltDependencies 를,
# 배포 서버(pnpm 11)는 allowBuilds 를 본다. 한쪽만 적으면 다른 쪽에서 막힌다.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
