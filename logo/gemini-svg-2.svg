<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <!-- 배경: #0C1A2B (night) -->
  <rect width="420" height="100" rx="16" fill="#0C1A2B"/>
  
  <!-- 심볼 영역 -->
  <g transform="translate(18, 10)">
    <!-- 타이머 외곽 원: #FFB01F (signal) -->
    <circle cx="40" cy="40" r="28" fill="none" stroke="#FFB01F" stroke-width="5" stroke-dasharray="135 40" stroke-linecap="round"/>
    
    <!-- 타이머 상단 버튼: #FFB01F -->
    <path d="M 33,8 L 47,8" stroke="#FFB01F" stroke-width="4" stroke-linecap="round"/>

    <!-- 내부 눈금 포인트 -->
    <line x1="40" y1="18" x2="40" y2="22" stroke="#FFB01F" stroke-width="2" opacity="0.4"/>
    <line x1="62" y1="40" x2="58" y2="40" stroke="#FFB01F" stroke-width="2" opacity="0.4"/>
    <line x1="40" y1="62" x2="40" y2="58" stroke="#FFB01F" stroke-width="2" opacity="0.4"/>
    <line x1="18" y1="40" x2="22" y2="40" stroke="#FFB01F" stroke-width="2" opacity="0.4"/>

    <!-- 출발 대각선 화살표: #FFB01F (명확한 대각선 및 화살표 머리) -->
    <line x1="25" y1="55" x2="55" y2="25" stroke="#FFB01F" stroke-width="6" stroke-linecap="round"/>
    <path d="M 39,25 L 55,25 L 55,41" fill="none" stroke="#FFB01F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 서비스명: 언제(흰색) + 나가(#FFB01F) -->
  <text x="110" y="55" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="-1">
    언제<tspan fill="#FFB01F">나가</tspan>
  </text>

  <!-- 서브 도메인 텍스트 -->
  <text x="112" y="78" font-family="'Pretendard', sans-serif" font-weight="600" font-size="14" fill="#FFB01F" opacity="0.6" letter-spacing="0.5">
    whenigo.p-e.kr
  </text>
</svg>
