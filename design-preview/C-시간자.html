<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFFFFF;--ink:#0B0F14;--soft:#737C87;--line:#D9DEE4;--now:#0B7A5B;--dead:#B4341F}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 "Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:40px 36px 56px}
.num{font-family:"Instrument Sans",sans-serif;font-variant-numeric:tabular-nums}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:34px}
.head h1{font:700 24px/1 "Noto Sans KR",sans-serif;letter-spacing:-.02em}
.head span{color:var(--soft);font-size:14px}
.axis{display:grid;grid-template-columns:64px 26px 1fr;align-items:start}
.t{font:600 16px/1 "Instrument Sans",sans-serif;font-variant-numeric:tabular-nums;text-align:right;padding-top:1px;color:var(--soft)}
.t.key{font-size:20px;font-weight:700;color:var(--ink)}
.rail{position:relative;height:100%;justify-self:center;width:2px;background:var(--line)}
.rail.thick{width:6px;background:var(--ink);border-radius:3px}
.rail.dot{width:2px;background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px)}
.node{width:11px;height:11px;border-radius:50%;background:var(--ink);justify-self:center;margin-top:1px}
.node.open{background:#fff;border:2.5px solid var(--ink)}
.node.dead{background:var(--dead)}
.node.now{background:var(--now)}
.c{padding:0 0 30px 6px}
.c h2{font:700 17px/1.3 "Noto Sans KR",sans-serif}
.c p{color:var(--soft);font-size:14px;margin-top:2px}
.c p b{color:var(--ink);font-weight:600}
.gap{padding:0 0 30px 6px;color:var(--soft);font-size:14px}
.slack{display:inline-block;margin-top:6px;padding:3px 9px;border:1px solid var(--now);color:var(--now);
  border-radius:999px;font-size:12px;font-weight:600}
.hero{font:700 64px/1 "Instrument Sans",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:0 0 4px}
.heronote{color:var(--soft);font-size:15px;margin-bottom:30px}
</style>
<div class="wrap">
  <div class="head"><h1>대전 → 부산</h1><span>지금 12:02</span></div>
  <p class="hero num">19:06</p>
  <p class="heronote">에 나가면 됩니다. 21:00 기한까지 8분이 남습니다.</p>
  <div class="axis">
    <div class="t key">21:00</div><div class="node dead"></div>
    <div class="c"><h2>도착 기한</h2><p>여기서부터 거꾸로 계산합니다</p></div>

    <div class="t"></div><div class="rail dot"></div>
    <div class="gap">여유 8분</div>

    <div class="t key">20:52</div><div class="node open"></div>
    <div class="c"><h2>부산 도착</h2></div>

    <div class="t"></div><div class="rail thick"></div>
    <div class="gap">KTX-산천 00371 · 1시간 46분 · 33,100원<br><span class="slack">계획 시간표</span></div>

    <div class="t key">19:06</div><div class="node"></div>
    <div class="c"><h2>대전 출발</h2><p>여유 <b>9분</b> 포함</p></div>

    <div class="t"></div><div class="rail dot"></div>
    <div class="gap">지금부터 7시간 4분</div>

    <div class="t key" style="color:var(--now)">12:02</div><div class="node now"></div>
    <div class="c"><h2>지금</h2><p>아직 여유가 있습니다</p></div>
  </div>
</div>
