<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#FBFAF7;--ink:#16181C;--soft:#6B6F76;--rule:#D6D3CC;--hair:#EAE7E0;--mark:#C8202A}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 "Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:44px 36px 60px}
.num{font-family:"Roboto Condensed",sans-serif;font-variant-numeric:tabular-nums}
.masthead{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:10px;border-bottom:2px solid var(--ink)}
.masthead h1{font:700 27px/1 "Noto Sans KR",sans-serif;letter-spacing:-.02em}
.masthead .when{color:var(--soft);font-size:14px}
.verdict{display:flex;align-items:baseline;gap:18px;padding:26px 0 8px;border-bottom:1px solid var(--hair)}
.verdict .big{font:700 76px/.9 "Roboto Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.verdict p{font-size:17px}
.verdict p em{font-style:normal;color:var(--soft);display:block;font-size:14px;margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:22px}
caption{text-align:left;font-size:14px;color:var(--soft);padding-bottom:8px}
th{text-align:left;font:500 13px/1 "Noto Sans KR",sans-serif;color:var(--soft);
  padding:0 0 7px;border-bottom:1px solid var(--rule)}
th.r,td.r{text-align:right}
td{padding:11px 0;border-bottom:1px solid var(--hair);font-size:15px}
td.t{font-family:"Roboto Condensed",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;width:76px}
tr.now td{background:linear-gradient(90deg,rgba(200,32,42,.055),transparent 62%)}
tr.now td.t{color:var(--mark);position:relative}
tr.now td.t::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-left:7px solid var(--mark)}
.note{margin-top:24px;padding-left:14px;border-left:3px solid var(--mark);font-size:14px;color:var(--soft)}
.note b{color:var(--ink)}
.foot{display:flex;gap:38px;margin-top:30px;padding-top:16px;border-top:2px solid var(--ink)}
.foot div span{display:block;color:var(--soft);font-size:13px}
.foot div strong{font:700 19px/1.4 "Roboto Condensed",sans-serif;font-variant-numeric:tabular-nums}
</style>
<div class="wrap">

    <p>에 나가세요<em>20:52 도착 — 기한까지 8분 남습니다</em></p>
  </div>

    <tr><th>출발</th><th>도착</th><th>편성</th><th class="r">요금</th><th class="r">여유</th></tr>
    <tr><td class="t">18:14</td><td class="t" style="font-weight:400">20:01</td><td>KTX 00107</td><td class="r">36,200</td><td class="r">59분</td></tr>
    <tr class="now"><td class="t">19:06</td><td class="t" style="font-weight:400">20:52</td><td>KTX-산천 00371</td><td class="r">33,100</td><td class="r">8분</td></tr>
    <tr><td class="t">19:19</td><td class="t" style="font-weight:400">20:55</td><td>KTX 00063</td><td class="r">36,200</td><td class="r">5분</td></tr>
    <tr><td class="t">20:22</td><td class="t" style="font-weight:400">22:10</td><td>무궁화호 01193</td><td class="r">26,500</td><td class="r">늦음</td></tr>
  </table>
  <p class="note">가장 늦게 나가도 되는 편입니다. <b>19:19 KTX 00063</b> 도 닿지만 여유가 5분뿐입니다.</p>
  <div class="foot">
    <div><span>총 소요</span><strong>1시간 46분</strong></div>

</div>
