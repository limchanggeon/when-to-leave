<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --night:#0C1A2B; --night-2:#132539; --amber:#FFB01F; --amber-dim:#C98A1C;
  --paper:#FCFCFD; --ink:#111820; --ink-soft:#5A6675; --rule:#E3E7EC;
}
body{background:var(--paper);color:var(--ink);font:400 15px/1.6 "Noto Sans KR","Archivo",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 32px}
.num{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ── 안내판 ── */
.board{background:var(--night);color:#fff;padding:44px 0 40px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);pointer-events:none}
.route{display:flex;align-items:baseline;gap:14px;color:#8FA6C0;font-size:15px;font-weight:500}
.route b{color:#fff;font-weight:700;font-size:19px}
.answer{display:flex;align-items:flex-end;gap:28px;margin-top:20px}
.big{font:800 108px/.86 "Archivo",sans-serif;font-variant-numeric:tabular-nums;color:var(--amber);letter-spacing:-.045em}
.answer figcaption{padding-bottom:12px}
.answer figcaption span{display:block;color:#8FA6C0;font-size:14px}
.answer figcaption strong{display:block;color:#fff;font-size:22px;font-weight:600;margin-top:2px}
.boardrow{display:grid;grid-template-columns:auto 1fr auto;gap:0 26px;align-items:center;
  margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14)}
.boardrow .t{font:600 30px/1 "Archivo",sans-serif;font-variant-numeric:tabular-nums;color:#fff}
.boardrow .m{color:#8FA6C0;font-size:14px}
.boardrow .m b{color:var(--amber);font-weight:600}
.left{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.left span{color:#8FA6C0;font-size:13px}
.left .t2{font:600 27px/1 "Archivo",sans-serif;font-variant-numeric:tabular-nums;color:var(--amber)}

/* ── 아래: 여정 ── */
.body{padding:38px 0 56px}
.legs{display:grid;grid-template-columns:auto 1fr;gap:0 22px}
.legs .clock{font:600 17px/1 "Archivo",sans-serif;font-variant-numeric:tabular-nums;padding-top:2px;color:var(--ink)}
.legs .stem{border-left:2px solid var(--ink);padding:0 0 26px 22px;position:relative}
.legs .stem::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.legs .stem.last{border-left-color:transparent;padding-bottom:0}
.legs .stem.last::before{background:var(--amber);box-shadow:0 0 0 3px rgba(255,176,31,.25)}
.place{font-weight:700;font-size:17px}
.mode{color:var(--ink-soft);font-size:14px;margin-top:3px}
.mode b{color:var(--ink);font-weight:600}
.facts{display:flex;gap:44px;margin-top:34px;padding-top:22px;border-top:1px solid var(--rule)}
.facts div span{display:block;color:var(--ink-soft);font-size:13px}
.facts div strong{font:600 21px/1.3 "Archivo",sans-serif;font-variant-numeric:tabular-nums}
</style>
<section class="board"><div class="wrap">
  <p class="route">대전 <b>→</b> 부산 <span style="opacity:.6">· 21:00까지 도착</span></p>
  <figure class="answer">
    <div class="big num">19:06</div>
    <figcaption><span>에 나가세요</span><strong>여유 9분</strong></figcaption>
  </figure>
  <div class="boardrow">
    <div class="t num">19:06</div>
    <div class="m">KTX-산천 <b>00371</b> · 1시간 46분 · 33,100원</div>
    <div class="left"><span>출발까지</span><div class="t2 num">7:04</div></div>
  </div>
</div></section>
<section class="body"><div class="wrap">
  <div class="legs">
    <div class="clock num">19:06</div>
    <div class="stem"><div class="place">대전</div><div class="mode">열차 <b>KTX-산천 00371</b> · 1시간 46분</div></div>
    <div class="clock num">20:52</div>
    <div class="stem last"><div class="place">부산</div><div class="mode">21:00 도착 기한까지 <b>8분</b> 남습니다</div></div>
  </div>
  <div class="facts">
    <div><span>총 소요</span><strong>1시간 46분</strong></div>
    <div><span>환승</span><strong>없음</strong></div>
    <div><span>도보</span><strong>0분</strong></div>
    <div><span>요금</span><strong>33,100원</strong></div>
  </div>
</div></section>
