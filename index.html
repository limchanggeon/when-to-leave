<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>언제나가 — 출발 시각 역산</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 주소창·탭 색까지 판으로 맞춘다 -->
    <meta name="theme-color" content="#0C1A2B" />
    <meta
      name="description"
      content="도착 시각을 말하면 몇 시에 나가야 하는지 계산합니다. 열차·버스 시각표와 환승·도보까지 거꾸로 짚어 출발 시각을 찾습니다."
    />

    <!-- 링크 미리보기(카카오톡·슬랙 등). og:image 는 절대 주소여야 한다 —
         상대 경로로 두면 대부분의 미리보기가 그림을 못 가져온다.
         그림 원본은 logo/og-image.html 이고, 거기 주석에 다시 만드는 법이 있다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="언제나가" />
    <meta property="og:title" content="언제나가 — 도착 시각에서 출발 시각을 역산" />
    <meta
      property="og:description"
      content="&quot;11시까지 부산&quot; 이라고 하면 &quot;19:06에 나가세요&quot; 라고 답합니다."
    />
    <meta property="og:url" content="https://whenigo.p-e.kr/" />
    <meta property="og:image" content="https://whenigo.p-e.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
    />
    <!--
      구글 애드센스. 광고는 이 스크립트가 알아서 붙인다.

      CSP 를 함께 열어야 한다(deploy/Caddyfile) — 광고는 스크립트를
      더 불러오고 프레임을 띄우므로, 막힌 채로 두면 조용히 아무것도
      안 나온다. 어떤 출처가 필요한지는 브라우저로 재서 넣었다.
    -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2327680830824048"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
