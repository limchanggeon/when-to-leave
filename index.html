<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>언제나가 — 출발 시각 역산</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 주소창·탭 색까지 판으로 맞춘다 -->
    <meta name="theme-color" content="#0C1A2B" />
    <meta
      name="description"
      content="도착 시각을 말하면 몇 시에 나가야 하는지 계산합니다. 열차·버스 시각표와 환승·도보까지 거꾸로 짚어 출발 시각을 찾습니다."
    />

    <!-- 링크 미리보기(카카오톡·슬랙 등). og:image 는 절대 주소여야 한다 —
         상대 경로로 두면 대부분의 미리보기가 그림을 못 가져온다.
         그림 원본은 logo/og-image.html 이고, 거기 주석에 다시 만드는 법이 있다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="언제나가" />
    <meta property="og:title" content="언제나가 — 도착 시각에서 출발 시각을 역산" />
    <meta
      property="og:description"
      content="&quot;11시까지 부산&quot; 이라고 하면 &quot;19:06에 나가세요&quot; 라고 답합니다."
    />
    <meta property="og:url" content="https://whenigo.p-e.kr/" />
    <meta property="og:image" content="https://whenigo.p-e.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      일본어 폰트(Noto Sans JP)는 여기 없다. 일본어를 고른 사람만 받는다
      (src/ui/PrefsContext.tsx).

      CJK 폰트는 글자마다 unicode-range 를 쪼개 넣으므로 **목록 자체가 크다.**
      JP 를 같이 넣으면 이 스타일시트가 gzip 209 kB 가 되고, 스타일시트는
      렌더를 막으므로 한국어로 들어온 사람이 쓰지도 않을 118 kB 를 기다린 뒤에야
      화면을 본다. 빼면 91 kB 다.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
    />
    <!--
      구글 애드센스. VITE_ADSENSE_CLIENT 가 있을 때만 들어간다(vite.config.ts).

      값이 없으면 이 줄은 통째로 사라진다. 승인 전에는 광고가 하나도 안
      나오는데 스크립트는 913 kB 를 받아오고 LCP 를 1.34초 늘린다 —
      아무도 못 보는 광고를 위해 모든 방문자가 치르는 값이다.
      도메인을 사고 승인받으면 서버의 .env 에 값만 넣으면 된다.

      켤 때는 CSP 도 함께 열어야 한다(deploy/Caddyfile). 광고는 스크립트를
      더 불러오고 프레임을 띄우므로, 막힌 채로 두면 조용히 아무것도 안 나온다.
      필요한 출처는 이미 Caddyfile 에 들어 있다.
    -->
    <!--ADSENSE-->
  </head>
  <body>
    <div id="root"></div>
    <!--
      자바스크립트를 돌리지 않는 수집기를 위한 최소한의 내용.

      화면은 자바스크립트가 그리므로 원본 HTML 의 body 는 비어 있다.
      구글은 자바스크립트를 돌린 뒤를 읽으니 대개 문제가 없지만, 안 돌리는
      쪽(일부 광고·검색 수집기, 링크 미리보기)에는 이 사이트가 빈 페이지로
      보인다. 여기 적힌 것은 화면에 실제로 있는 말과 같아야 한다 —
      수집기에만 보여주려고 다른 말을 적으면 그게 클로킹이다.
    -->
    <noscript>
      <h1>언제나가 — 도착 시각에서 출발 시각을 역산합니다</h1>
      <p>
        어디로 몇 시까지 가는지 넣으면 몇 시에 나가야 하는지 알려줍니다.
        열차·버스 시각표와 환승·도보 시간을 거꾸로 짚어 계산합니다.
      </p>
      <p>이 화면을 보려면 자바스크립트가 필요합니다. 브라우저 설정에서 켜주세요.</p>
      <p><a href="/privacy">개인정보 처리방침</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
